name: Collect opportunities
on:
  schedule:
    - cron: '23 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: opportunity-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Collect and export
        id: collect
        run: python -m opportunities collect
      - name: Upload workbook and collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-review-${{ github.run_number }}
          path: |
            output/opportunities.xlsx
            output/opportunities.csv
            output/collection-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Save listing history
        if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        run: |
          if [ ! -f data/opportunities.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/opportunities.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh opportunity listings'
          git push
